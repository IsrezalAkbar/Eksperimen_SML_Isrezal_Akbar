name: Automated Preprocessing Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'dataset_raw/**'
      - 'preprocessing/**'
      - '.github/workflows/preprocessing.yml'
  workflow_dispatch:        # Bisa dijalankan manual dari GitHub UI

jobs:
  preprocessing:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python 3.12.7 ──────────────────────────────────────
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Verifikasi dataset tersedia ──────────────────────────────
      - name: Verify Dataset Exists
        run: |
          if [ ! -f "dataset_raw/winequality.csv" ]; then
            echo "Dataset not found! Downloading from UCI..."
            python - <<'EOF'
          import urllib.request, os
          os.makedirs("dataset_raw", exist_ok=True)
          url_red   = "https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-red.csv"
          url_white = "https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-white.csv"
          import pandas as pd
          df_red   = pd.read_csv(url_red,   sep=";")
          df_white = pd.read_csv(url_white, sep=";")
          df_red["wine_type"]   = 0
          df_white["wine_type"] = 1
          df = pd.concat([df_red, df_white], ignore_index=True)
          df.to_csv("dataset_raw/winequality.csv", index=False)
          print(f"Dataset saved: {df.shape}")
          EOF
          else
            echo "Dataset found."
          fi

      # ── 5. Jalankan preprocessing otomatis ──────────────────────────
      - name: Run Automated Preprocessing
        run: |
          python preprocessing/automate_NamaSiswa.py \
            --input  dataset_raw/winequality.csv \
            --output preprocessing/dataset_preprocessing

      # ── 6. Verifikasi output preprocessing ──────────────────────────
      - name: Verify Preprocessing Output
        run: |
          echo "=== Preprocessing Output Files ==="
          for f in preprocessing/dataset_preprocessing/*.csv; do
            lines=$(wc -l < "$f")
            echo "  $f  →  $lines baris"
          done

      # ── 7. Upload hasil preprocessing sebagai GitHub Artifact ───────
      - name: Upload Preprocessed Dataset as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-preprocessing-${{ github.run_number }}
          path: preprocessing/dataset_preprocessing/
          retention-days: 30

      # ── 8. Commit hasil preprocessing ke repository ─────────────────
      - name: Commit Preprocessed Dataset to Repository
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/dataset_preprocessing/
          git diff --staged --quiet || git commit -m \
            "ci: update preprocessed dataset [run #${{ github.run_number }}]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
